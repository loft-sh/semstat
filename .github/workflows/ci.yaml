name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files: ${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: loft-sh/github-actions/.github/actions/govulncheck@035ae723b4ec9ad3a3ae8b13f12c26c75be5ea5e # govulncheck/v1
        with:
          # Slack notification is for scheduled scans in product repos, not PR runs here.
          notify: "false"

  release-config:
    # A release config only breaks when a tag is pushed, which is the worst time
    # to find out. This builds everything a real release builds, minus publish.
    name: Release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Kept off to match the release workflow, which cannot cache: this job
          # exists to reproduce that build, so it has to build the same way.
          cache: false

      # No QEMU here either, so this job proves the release can build both
      # architectures without emulation before a tag depends on it.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned to match the release job. Floating here would let CI green-light
          # a config the pinned release binary cannot run.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.17.0
          args: check

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned to match the release job. Floating here would let CI green-light
          # a config the pinned release binary cannot run.
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.17.0
          # Signing needs an OIDC token a pull request does not get, and the
          # SBOM adds nothing to a build that is thrown away.
          args: release --snapshot --clean --skip=sign,sbom

      - name: Smoke test the built binary
        run: |
          set -euo pipefail
          binary=dist/semstat_linux_amd64_v1/semstat
          test "$("$binary" type v2.0.0-rc.2)" = "rc"
          test "$("$binary" compare v2.0.0-rc.2 v2.0.0)" = "-1"

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  zizmor:
    name: Audit workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - run: pip install zizmor==1.24.1 && zizmor .github/

  validate-renovate:
    name: Validate Renovate config
    # Pull requests only. The shared workflow detects changes with paths-filter,
    # which on a push has to fetch the previous commit, and its checkout is
    # shallow with credentials stripped, so the job dies before validating.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: loft-sh/github-actions/.github/workflows/validate-renovate.yaml@c40c1db6d6d24f1b75f6db794efe3a1bbf7cfb1a # validate-renovate/v1
